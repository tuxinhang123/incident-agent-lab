services:
  redis:
    image: redis:7-alpine
    container_name: ial-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  demo-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ial-demo-api
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  seed:
    image: redis:7-alpine
    container_name: ial-seed
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - redis-cli
      - -h
      - redis
      - SET
      - demo:greeting
      - "hello from incident-agent-lab"
    restart: "no"
